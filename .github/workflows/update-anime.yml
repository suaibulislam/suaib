name: Update Anime List

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Current Anime List
        run: |
          node -e '
          const fs = require("fs");
          async function update() {
            try {
              const res = await fetch("https://api.jikan.moe/v4/users/blankeed/animelist?status=watching");
              const data = await res.json();
              if (data?.data && Array.isArray(data.data) && data.data.length > 0) {
                const list = data.data.map(item => {
                  const entry = item.entry || item.anime || item.node || item;
                  return {
                    title: (entry.title || "one piece").toLowerCase(),
                    url: entry.url || `https://myanimelist.net/anime/${entry.mal_id || entry.id || ""}`
                  };
                });
                fs.writeFileSync("src/data/anime.json", JSON.stringify(list, null, 2));
                console.log("Successfully wrote anime.json:", list);
              } else {
                console.log("No active watching entries found.");
              }
            } catch (err) {
              console.error("Fetch failed:", err);
            }
          }
          update();
          '

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/anime.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update watching anime list" && git push)
